name: VitalSync CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # Étape 1 – Lint & Tests
  # ─────────────────────────────────────────
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installation des dépendances
        working-directory: ./backend
        run: npm ci

      - name: Lint ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Exécution des tests Jest
        working-directory: ./backend
        run: npm test

  # ─────────────────────────────────────────
  # Étape 2 – Build Docker
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login vers Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push image backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vitalsync-backend:${{ github.sha }}

      - name: Build & Push image frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vitalsync-frontend:${{ github.sha }}

  # ─────────────────────────────────────────
  # Étape 3 – Déploiement staging
  # ─────────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Création du fichier .env
        run: |
          echo "NODE_ENV=production" >> .env
          echo "DB_HOST=database" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

      - name: Déploiement via Docker Compose
        run: docker compose up -d --build

      - name: Attente du démarrage
        run: sleep 10

      - name: Health check du back-end
        run: |
          curl --fail http://localhost:3000/health || exit 1